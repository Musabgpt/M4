name: Agent core smoke tests
on:
  push:
    branches: [main, feat/ai-agent-runtime]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install real search test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - name: Python unit tests
        run: |
          python3 -m unittest discover -s agent_tests -v
          python3 -m unittest discover -s tests -p 'test_signing_policy.py' -v
      - name: Verify chat startup failure receipts
        run: bash tests/test_agent_launch_receipt.sh
      - name: Python compile and script validation
        run: |
          python3 -m py_compile agent/agent.py agent/provider_routes.py
          test -s agent/system_prompt.md
          bash -n agent/term-agent.sh agent/m4-agent-start.sh agent/term-agent-watch.sh
      - name: Record actual public provider and file creation result
        timeout-minutes: 3
        run: python3 scripts/probe-chat.py qa-provider
      - name: Preserve live provider evidence (inspect PASS or BLOCKED in receipt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M4-Live-Provider-Evidence
          path: qa-provider/
