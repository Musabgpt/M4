name: M4 — Android runtime evidence
on:
  pull_request:
  workflow_dispatch:
    inputs:
      termux_engine:
        description: Test official Termux RUN_COMMAND, PTY and Filesystem MCP on Android
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M4_TEST_TERMUX_ENGINE: ${{ inputs.termux_engine || false }}
      M4_TEST_ABIS: x86_64
      M4_RUNTIME_ABI: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Bundle real Alpine and PRoot for the emulator architecture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          bash scripts/bundle-linux.sh
      - name: Real Android WebView, Arabic PDF, ownership and scheduler checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/run-android-qa.sh
      - name: Preserve actual device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M4-Android-QA-Evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            qa-device/
          if-no-files-found: warn
