name: M4 — Android runtime evidence
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      M4_TEST_ABIS: arm64-v8a,x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android WebView, Arabic PDF, ownership and scheduler checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest --stacktrace
            mkdir -p qa-device
            adb exec-out run-as dev.newal.code.lite.connectors.m4dev tar -C files -cf - qa > qa-device/receipts.tar
            adb logcat -d -v threadtime > qa-device/logcat.txt
      - name: Preserve actual device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M4-Android-QA-Evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            qa-device/
          if-no-files-found: warn
