name: M4 — Termux-backed Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: قراءة الشيفرة
        uses: actions/checkout@v4
      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: أدوات البناء الأصلية
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: اختبار وكيل البرمجة والاستمرارية والأمان
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          python3 -m unittest discover -s agent_tests -v
          python3 -m py_compile agent/agent.py agent/provider_routes.py agent/newal/continuity.py agent/newal/task_state.py
          bash -n agent/term-agent.sh agent/term-agent-watch.sh agent/m4-agent-start.sh
      - name: Verify chat startup failure receipts
        run: bash tests/test_agent_launch_receipt.sh
      - name: تثبيت Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: اختبارات المحرك والأوامر العربية
        run: |
          mkdir -p tests/out
          javac -encoding UTF-8 -d tests/out \
            app/src/main/java/io/musab/arabicterminal/ArabicCommandRouter.java \
            app/src/main/java/io/musab/arabicterminal/TerminalScreen.java \
            app/src/main/java/io/musab/arabicterminal/CommandBatch.java \
            app/src/main/java/io/musab/arabicterminal/PackageCommands.java \
            app/src/main/java/io/musab/arabicterminal/RootArchive.java \
            app/src/main/java/io/musab/arabicterminal/RootArchiveImporter.java \
            app/src/main/java/io/musab/arabicterminal/ArchiveVerifier.java \
            app/src/main/java/io/musab/arabicterminal/SafeFileImporter.java \
            tests/Checks.java tests/DeviceCommandsTest.java tests/CommandBatchTest.java tests/PackageCommandsTest.java tests/RootArchiveTest.java tests/ArchiveVerifierTest.java tests/SafeFileImporterTest.java tests/RootArchiveImporterTest.java
          java -cp tests/out Checks
          java -cp tests/out DeviceCommandsTest
          java -cp tests/out CommandBatchTest
          java -cp tests/out PackageCommandsTest
          java -cp tests/out RootArchiveTest
          java -cp tests/out ArchiveVerifierTest
          java -cp tests/out SafeFileImporterTest
          java -cp tests/out RootArchiveImporterTest
      - name: بناء APK عبر Android SDK وNDK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Ensure APK excludes Alpine PRoot and native Arabic PTY
        run: |
          python3 - <<'PY'
          import zipfile
          apk = 'app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as archive:
              blocked = [n for n in archive.namelist()
                         if any(term in n.lower() for term in
                                ('alpine-rootfs', 'libproot', 'libarabicpty'))]
          if blocked:
              raise SystemExit('Legacy native binaries still present: ' + repr(blocked))
          print('PASS: only Termux external runtime is used')
          PY
      - name: تحقق من توقيع وبصمة APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
      # A separately named, debug-signed ARM64 package for physical device QA.
      # It uses the .m4dev applicationId and cannot update the original app.
      # This is never a release and does not use protected signing secrets.
      - name: Upload ARM64 device QA candidate (NOT an app release)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: M4-ARM64-DEVICE-QA-DEBUG-NOT-RELEASE
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: إيداع APK قابل للتثبيت
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ArabicTerminal-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      - name: Detect original NewAl signing identity (M4 repository secret)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        id: persistent_signing
        env:
          MUSABAI_RELEASE_SIGNING_BUNDLE: ${{ secrets.MUSABAI_RELEASE_SIGNING_BUNDLE }}
        run: |
          if [ -n "$MUSABAI_RELEASE_SIGNING_BUNDLE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No original signing key in this repo: only separate-package development APK is available; no update-compatible release will be published."
          fi
      - name: Build update-compatible APK using original private signing key
        if: steps.persistent_signing.outputs.available == 'true'
        env:
          MUSABAI_RELEASE_SIGNING_BUNDLE: ${{ secrets.MUSABAI_RELEASE_SIGNING_BUNDLE }}
          M4_BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-signed-release.sh
      - name: Publish only verified same-certificate NewAl updates
        if: steps.persistent_signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: M4-NewAl-Cloud-Signed-Update
          path: release-output/
          if-no-files-found: error
          retention-days: 14
