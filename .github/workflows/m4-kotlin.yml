name: M4 — Kotlin Compose Compile
on:
  pull_request:
  push:
    branches: [main, feat/compose-newal-term]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Compose, Kotlin and Java (no Alpine download)
        run: gradle --no-daemon :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace
