name: M4 — Android static quality gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android lint — error severity blocks the PR
        run: gradle --no-daemon :app:lintDebug --stacktrace
      - name: Preserve source-backed lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M4-Android-Static-Lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
