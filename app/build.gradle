plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
// A certificate fingerprint is public information; it is NOT a signing key.
// Release builds require the original NewAl-Cloud key injected by CI.
def releaseFile = System.getenv('MUSABAI_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('MUSABAI_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('MUSABAI_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MUSABAI_RELEASE_KEY_PASSWORD')
def signingFields = [releaseFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
def hasReleaseSigning = signingFields.every { it != null && !it.isEmpty() }
if (signingFields.any { it != null && !it.isEmpty() } && !hasReleaseSigning) {
    throw new GradleException('Incomplete persistent NewAl release signing credentials')
}

android {
    namespace 'io.musab.arabicterminal'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.newal.code.lite.connectors'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 26
        targetSdk 35
        // NewAl-Cloud last compatible release build used versionCode 363.
        // GitHub M4_BUILD_NUMBER monotonically advances across releases.
        versionCode (10000 + ((System.getenv('M4_BUILD_NUMBER') ?: '0') as Integer))
        versionName '2.0.0'
        buildConfigField 'String', 'ORIGINAL_CERT_SHA256', '"' + rootProject.file('android/signing-cert-sha256.txt').text.trim() + '"'
        buildConfigField 'String', 'RUNTIME_ABI', '"' + (System.getenv('M4_RUNTIME_ABI') ?: 'arm64-v8a') + '"'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { compose true; buildConfig true }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        if (hasReleaseSigning) {
            musabRelease {
                storeFile file(releaseFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }
    buildTypes {
        debug {
            // Development builds must NEVER masquerade as an update for
            // the NewAl release package with a different debug key.
            applicationIdSuffix '.m4repair'
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.musabRelease
            } else {
                signingConfig null
            }
        }
    }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.27.1'
    testImplementation 'junit:junit:4.13.2'
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'com.android.tools.build:apksig:8.9.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.04.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
